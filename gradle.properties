# Project-wide Gradle settings for the CashSDK Android library.

# AndroidX is required by Compose + Billing 9.
android.useAndroidX=true

# Per-module R classes (smaller, faster) — the modern default.
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel + cached builds.
org.gradle.parallel=true
org.gradle.caching=true

# ── Publication coordinates ───────────────────────────────────────────────────
# The single source of truth for the version: the AAR, the POM and BuildConfig
# (CASHSDK_VERSION) all read these, so they cannot drift apart.
#
# GROUP is the Maven Central namespace. JitPack ignores it and serves the same artifact as
# `com.github.cashsdk:cashsdk-android:<tag>`; both coordinates carry identical bytes.
# Bumping VERSION_NAME here is step one of a release — see AGENTS/SDK-DISTRIBUTION.md.
GROUP=com.cashsdk
VERSION_NAME=1.2.0
