# Project-wide Gradle settings for the CashSDK Android library.

# AndroidX is required by Compose + Billing 7.
android.useAndroidX=true

# Per-module R classes (smaller, faster) — the modern default.
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel + cached builds.
org.gradle.parallel=true
org.gradle.caching=true
