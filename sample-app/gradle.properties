org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Filled in after the CashSDK app is created (Create app → Android → drop the key → keys shown
# once). Overridable on the CLI: -PcashsdkPk=csk_pk_… -PcashsdkApiBase=https://…
cashsdkPk=csk_pk_REPLACE_ME
cashsdkApiBase=https://cashsdk-api-production.up.railway.app
# The subscription productId + base plan to buy (create it in Play Console, set base plan Active).
cashsdkProductId=REPLACE_WITH_YOUR_SUBSCRIPTION_ID
